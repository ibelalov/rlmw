name: Notebook smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  notebook-smoke:
    runs-on: ubuntu-latest

    env:
      RLMW_HEADLESS: "1"
      RLMW_SMOKE: "1"
      RLMW_PROJECT_ROOT: "/tmp/rlmw"
      RLMW_SOURCE_ROOT: "${{ github.workspace }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            scipy \
            pandas \
            matplotlib \
            tqdm \
            nbformat \
            jupyter \
            nbconvert \
            nbclient \
            ipykernel \
            ortools \
            "python-sat[pblib,aiger]"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m ipykernel install --user --name python3

      - name: Research corpus validation
        run: |
          python -m py_compile rlmw_research_corpus.py
          python -m json.tool h_native_research_v1_manifest.json >/tmp/h_native_research_v1_manifest.pretty.json
          python rlmw_research_corpus.py --validate h_native_research_v1_manifest.json --smoke --print-summary
          python rlmw_research_corpus.py --validate h_native_research_v1_manifest.json --print-summary
          python rlmw_research_corpus.py --self-test --print-summary
          python -O rlmw_research_corpus.py --validate h_native_research_v1_manifest.json --smoke --print-summary
          python -O rlmw_research_corpus.py --validate h_native_research_v1_manifest.json --print-summary
          python -O rlmw_research_corpus.py --self-test --print-summary

      - name: Research baseline contracts
        run: |
          python -m py_compile rlmw_research_baselines.py test_rlmw_research_baselines.py
          python rlmw_research_baselines.py self-test --print-summary
          python -m unittest -v test_rlmw_research_baselines.py
          python rlmw_research_baselines.py list --profile smoke --json >/tmp/rlmw_research_baseline_plan.json
          mkdir -p /tmp/rlmw_research_baseline_smoke
          python rlmw_research_baselines.py run \
            --profile smoke \
            --output-dir /tmp/rlmw_research_baseline_smoke
          python rlmw_research_baselines.py validate \
            /tmp/rlmw_research_baseline_smoke/rlmw_research_baseline_results.jsonl \
            --print-summary
          mkdir -p /tmp/rlmw_research_baseline_cp_sat
          python rlmw_research_baselines.py run \
            --profile smoke \
            --baseline cp_sat_threshold_reference_v1 \
            --case-id hnrv1-c0001 \
            --output-dir /tmp/rlmw_research_baseline_cp_sat
          python rlmw_research_baselines.py validate \
            /tmp/rlmw_research_baseline_cp_sat/rlmw_research_baseline_results.jsonl \
            --print-summary

      - name: Optimized research baseline contracts
        run: |
          python -O rlmw_research_baselines.py self-test --print-summary
          python -O -m unittest -v test_rlmw_research_baselines.py

      - name: Isolated Colab-like research loader
        run: |
          python - <<'PY'
          import json, os, pathlib, tempfile
          nb = json.load(open('rlmw.ipynb'))
          cell = next(''.join(c.get('source', [])) for c in nb['cells'] if c.get('cell_type') == 'code' and 'load_research_corpus_dependencies' in ''.join(c.get('source', [])))
          isolated = pathlib.Path(tempfile.mkdtemp(prefix='rlmw_isolated_source_'))
          os.environ.pop('RLMW_RESEARCH_CORPUS_REF', None)
          os.environ['RLMW_RESEARCH_CORPUS_BASE_URL'] = pathlib.Path.cwd().as_uri()
          g = {'SOURCE_ROOT': isolated, 'SMOKE': True, 'os': os, 'json': json}
          exec(compile(cell, 'rlmw.ipynb::research_loader_isolated', 'exec'), g)
          summary = g['_research_summary']
          assert summary['selected_cases'] == 9 and summary['total_cases'] == 23, summary
          assert g['RLMW_RESEARCH_PINNED_REF'] == '68742bf8ee9a83179478b0080366c0dda345a26c', g['RLMW_RESEARCH_PINNED_REF']
          assert g['_research_load']['load_mode'] == 'fetched', g['_research_load']
          print(summary)
          PY

      - name: Execute notebook
        run: |
          mkdir -p /tmp/rlmw_nb
          RLMW_HEADLESS=1 \
          RLMW_SMOKE=1 \
          RLMW_PROJECT_ROOT=/tmp/rlmw \
          jupyter nbconvert \
            --to notebook \
            --execute rlmw.ipynb \
            --output rlmw_executed.ipynb \
            --output-dir /tmp/rlmw_nb \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=900


      - name: Optimized certificate and protocol-contract validation
        run: |
          python -O - <<'PY'
          import json, os
          os.environ['RLMW_HEADLESS'] = '1'
          os.environ['RLMW_SMOKE'] = '1'
          os.environ['RLMW_PROJECT_ROOT'] = '/tmp/rlmw_opt'
          os.environ['RLMW_SOURCE_ROOT'] = os.environ.get('GITHUB_WORKSPACE', '')
          nb = json.load(open('rlmw.ipynb'))
          g = {}
          for i, cell in enumerate(nb['cells']):
              if cell.get('cell_type') != 'code':
                  continue
              code = ''.join(cell.get('source', []))
              exec(compile(code, f'rlmw.ipynb::cell_{i}', 'exec'), g)
              if 'run_h_native_v1_protocol_self_tests' in g:
                  g['run_h_native_certificate_validation_self_tests']()
                  g['run_h_native_v1_protocol_self_tests']()
                  try:
                      g['verify_h_native_v1_manifest_digest']('0' * 64)
                  except ValueError:
                      pass
                  else:
                      raise RuntimeError('incorrect manifest digest unexpectedly passed under python -O')
                  break
          else:
              raise RuntimeError('protocol validation self-tests were not defined')
          print('optimized certificate and protocol-contract validation passed')
          PY

      - name: Export and validate evidence bundle
        run: |
          mkdir -p /tmp/rlmw_nb /tmp/rlmw_evidence
          RLMW_HEADLESS=1 \
          RLMW_SMOKE=1 \
          RLMW_PROJECT_ROOT=/tmp/rlmw \
          RLMW_SOURCE_ROOT="$GITHUB_WORKSPACE" \
          RLMW_EXPORT_EVIDENCE=1 \
          RLMW_REPETITIONS=2 \
          RLMW_SEED=12345 \
          jupyter nbconvert \
            --to notebook \
            --execute rlmw.ipynb \
            --output rlmw_evidence_executed.ipynb \
            --output-dir /tmp/rlmw_nb \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=900
          python - <<'PY'
          import csv, glob, hashlib, json, subprocess, zipfile
          bundles = glob.glob('/tmp/rlmw_evidence/*.zip')
          assert len(bundles) == 1, bundles
          zpath = bundles[0]
          with zipfile.ZipFile(zpath) as z:
              names = set(z.namelist())
              required = {'manifest.json','correctness.json','benchmarks.csv','traces.jsonl','witnesses.json','member_hashes.json','summary.md'}
              assert required <= names, names
              hashes = json.loads(z.read('member_hashes.json'))
              for name, digest in hashes.items():
                  assert hashlib.sha256(z.read(name)).hexdigest() == digest, name
              manifest = json.loads(z.read('manifest.json'))
              source = manifest['source']
              assert source['is_git_checkout'] is True, source
              assert source['git_sha'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), source
              with open('rlmw.ipynb', 'rb') as f:
                  assert source['notebook_sha256'] == hashlib.sha256(f.read()).hexdigest(), source
              assert 'unknown_sour' not in zpath, zpath
              assert manifest['artifact_storage']['output_dir'] == '/tmp/rlmw_evidence', manifest['artifact_storage']
              witnesses = json.loads(z.read('witnesses.json'))['witnesses']
              for w in witnesses:
                  A, u, c, W = w['A'], w['u'], w['c'], int(w['W'])
                  replay = [sum((int(A[i][j]) & int(u[j])) for j in range(len(u))) % 2 for i in range(len(A))]
                  assert replay == c, w['id']
                  assert sum(c) > 0, w['id']
                  if w['threshold_verified']:
                      assert sum(c) <= W, w['id']
              traces = [json.loads(line) for line in z.read('traces.jsonl').decode().splitlines() if line.strip()]
              recognized = {'OPTIMAL','FEASIBLE','INFEASIBLE','UNKNOWN','MODEL_INVALID','NOT_INVOKED','UNAVAILABLE_DEPENDENCY'}
              solver_refs = [t for t in traces if t['variant'] == 'solver_reference']
              assert solver_refs
              for tr in solver_refs:
                  prov = tr['provenance']
                  assert prov.get('initial_threshold_hit') or (tr['trace'] and tr['trace'][0]['action'] == 4), tr
                  assert prov.get('solver_status') in recognized, prov
              rows = list(csv.DictReader(z.read('benchmarks.csv').decode().splitlines()))
              seeds = {r['run_seed'] for r in rows}
              assert len(seeds) >= 2, seeds
          print(zpath)
          PY

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: rlmw-colab-evidence
          path: /tmp/rlmw_evidence/*.zip
          if-no-files-found: error
